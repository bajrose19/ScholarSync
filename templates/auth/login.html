{% extends "base.html" %}
{% block title %}Sign in · ScholarSync{% endblock %}
{% block body %}
<main class="auth-screen">
  <div class="auth-card">
    <a class="brand" href="{{ url_for('home') }}">
      {% include "partials/brand.html" %}
      <span>ScholarSync</span>
    </a>
    <p class="muted center">Connect with research opportunities</p>
    <section class="card">
      <h1>Sign in</h1>
      {% include "partials/flashes.html" %}
      <form method="post" class="stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_path }}">
        <label>Email
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <p class="muted"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
      <p class="muted">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
    </section>
  </div>
</main>
{% endblock %}
